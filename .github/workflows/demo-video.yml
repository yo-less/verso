name: Generate Verso demo video

on:
  workflow_dispatch:
  push:
    branches: [demo-video-preview]
    paths:
      - '.github/workflows/demo-video.yml'
      - 'scripts/demo-video/**'
      - 'scripts/README-screenshots.py'
      - 'scripts/seed_screenshot_library.py'
      - 'cps/**'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DEMO_ROOT: /tmp/verso-demo
      DEMO_URL: http://127.0.0.1:18083
      DEMO_OUT: /tmp/verso-screenshots
      VIDEO_OUT: /tmp/verso-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture tools
        run: |
          pip install pillow playwright
          sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core ffmpeg
          python -m playwright install --with-deps chromium
      - name: Resolve licensed soundtrack
        env:
          MUSIC_URL: ${{ secrets.DEMO_MUSIC_URL }}
          MUSIC_TOKEN: ${{ secrets.DEMO_MUSIC_TOKEN }}
        run: |
          if [ -z "$MUSIC_URL" ]; then
            echo "::warning::DEMO_MUSIC_URL is not configured; this run will produce a silent review render."
            exit 0
          fi
          music="$RUNNER_TEMP/verso-demo-music.mp3"
          args=(--fail --silent --show-error --location --retry 2 --proto '=https' --proto-redir '=https')
          if [ -n "$MUSIC_TOKEN" ]; then
            args+=(--header "Authorization: Bearer $MUSIC_TOKEN" --header "Accept: application/vnd.github.raw+json")
          fi
          curl "${args[@]}" --output "$music" "$MUSIC_URL"
          echo "480cf9dc634e65f799fde5a0d7aa25b609c8c2b9f6bdd43a04a9809b08c27b26  $music" | sha256sum --check
          echo "DEMO_MUSIC=$music" >> "$GITHUB_ENV"
      - name: Seed isolated library
        run: |
          python scripts/seed_screenshot_library.py "$DEMO_ROOT"
          mkdir -p "$DEMO_ROOT/ingest" "$DEMO_OUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build exact checked-out source
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: verso-screenshot:local
          platforms: linux/amd64
          build-args: VERSION=v1.3.0-verso
          cache-from: type=gha,scope=verso-screenshots
          cache-to: type=gha,scope=verso-screenshots,mode=max
      - name: Start disposable instance
        run: |
          docker run -d --name verso-screenshot \
            -e PUID="$(id -u)" -e PGID="$(id -g)" -e TZ=UTC \
            -p 127.0.0.1:18083:8083 \
            -v "$DEMO_ROOT/config:/config" \
            -v "$DEMO_ROOT/library:/calibre-library" \
            -v "$DEMO_ROOT/ingest:/cwa-book-ingest" \
            verso-screenshot:local
          timeout 240 bash -c 'until curl -fsS "$DEMO_URL/health" >/dev/null; do sleep 4; done'
      - name: Initialize demo account
        run: python scripts/README-screenshots.py setup
      - name: Populate fictional reading history
        run: |
          docker stop verso-screenshot
          python scripts/seed_screenshot_library.py "$DEMO_ROOT" --history
          python scripts/demo-video/capture.py seed
          docker start verso-screenshot
          timeout 240 bash -c 'until curl -fsS "$DEMO_URL/health" >/dev/null; do sleep 4; done'
      - name: Capture and compose screenshots
        run: |
          python scripts/README-screenshots.py capture
          python scripts/demo-video/capture.py capture
      - name: Render and verify video
        run: python scripts/demo-video/render.py
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p "$VIDEO_OUT"
          docker logs verso-screenshot > "$VIDEO_OUT/container.log" 2>&1 || true
          docker rm -f verso-screenshot || true
          rm -f "$RUNNER_TEMP/verso-demo-music.mp3"
      - name: Upload preview MP4
        uses: actions/upload-artifact@v4
        with:
          name: verso-demo-video
          path: ${{ env.VIDEO_OUT }}/*.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Upload review frames and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verso-demo-review
          path: |
            ${{ env.VIDEO_OUT }}
            !${{ env.VIDEO_OUT }}/*.mp4
          retention-days: 14
