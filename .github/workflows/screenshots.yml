name: Capture Verso screenshots

on:
  workflow_dispatch:
  push:
    branches: [docs-screenshot-preview]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'scripts/README-screenshots.py'
      - 'scripts/seed_screenshot_library.py'
      - 'cps/**'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      landscape: ${{ steps.landscape.outputs.approved }}
    env:
      DEMO_ROOT: /tmp/verso-demo
      DEMO_URL: http://127.0.0.1:18083
      DEMO_OUT: /tmp/verso-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture tools
        run: |
          pip install pillow playwright
          sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
          python -m playwright install --with-deps chromium
      - name: Seed isolated library
        run: |
          python scripts/seed_screenshot_library.py "$DEMO_ROOT"
          mkdir -p "$DEMO_ROOT/ingest" "$DEMO_OUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build exact checked-out source
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: verso-screenshot:local
          platforms: linux/amd64
          build-args: VERSION=v1.3.0-verso
          cache-from: type=gha,scope=verso-screenshots
          cache-to: type=gha,scope=verso-screenshots,mode=max
      - name: Start disposable instance
        run: |
          docker run -d --name verso-screenshot \
            -e PUID="$(id -u)" -e PGID="$(id -g)" -e TZ=UTC \
            -p 127.0.0.1:18083:8083 \
            -v "$DEMO_ROOT/config:/config" \
            -v "$DEMO_ROOT/library:/calibre-library" \
            -v "$DEMO_ROOT/ingest:/cwa-book-ingest" \
            verso-screenshot:local
          timeout 240 bash -c 'until curl -fsS "$DEMO_URL/health" >/dev/null; do sleep 4; done'
      - name: Initialize demo account
        run: python scripts/README-screenshots.py setup
      - name: Populate fictional reading history
        run: |
          docker stop verso-screenshot
          python scripts/seed_screenshot_library.py "$DEMO_ROOT" --history
          docker start verso-screenshot
          timeout 240 bash -c 'until curl -fsS "$DEMO_URL/health" >/dev/null; do sleep 4; done'
      - name: Capture and compose screenshots
        run: python scripts/README-screenshots.py capture
      - name: Confirm approved landscape is served
        id: landscape
        if: ${{ hashFiles('cps/static/verso-login-landscape.webp') != '' }}
        run: |
          echo 'ee246a47ec3d36454c3cf79c56f7a3da88553ce1e81163ef8a9208c812c658dd  cps/static/verso-login-landscape.webp' | sha256sum -c -
          curl -fsS "$DEMO_URL/static/instance-branding/landscape" -o /tmp/verso-served-landscape.webp
          cmp cps/static/verso-login-landscape.webp /tmp/verso-served-landscape.webp
          python -c 'from PIL import Image; im=Image.open("/tmp/verso-served-landscape.webp"); assert im.format=="WEBP"; im.verify()'
          echo 'approved=true' >> "$GITHUB_OUTPUT"
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p "$DEMO_OUT"
          docker logs verso-screenshot > "$DEMO_OUT/container.log" 2>&1 || true
          docker rm -f verso-screenshot || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verso-readme-screenshots
          path: |
            ${{ env.DEMO_OUT }}
          retention-days: 14

  stage-readme:
    name: Stage verified screenshots
    needs: capture
    if: github.ref == 'refs/heads/docs-screenshot-preview' && needs.capture.outputs.landscape == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verso-readme-screenshots
          path: /tmp/verso-verified
      - name: Stage only the expected public demo images
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          src = Path('/tmp/verso-verified')
          dst = Path('docs/screenshots')
          manifest = json.loads((src / 'manifest.json').read_text())
          assert manifest['commit'] == os.environ['GITHUB_SHA']
          assert manifest['source'] == 'actual local browser captures'
          names = ['hero.png','login.png','library-light.png','library-dark.png',
                   'book-light.png','book-dark.png','kobo-light.png','kobo-dark.png',
                   'customize-dark.png','styled-sunset-light.png','year.png',
                   'highlights-light.png','highlights-dark.png','mobile.png','branding.png']
          assert set(manifest['screenshots']) == set(names)
          for name in names:
              p = src / name
              assert p.is_file() and p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              shutil.copyfile(p, dst / name)
          PY
          git add docs/screenshots/*.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Stage verified Verso redesign screenshots'
            git push origin HEAD:refs/heads/docs-screenshot-preview
          fi
